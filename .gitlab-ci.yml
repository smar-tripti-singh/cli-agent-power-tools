workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH

variables:
  DEV_ENV_RUNNER: dev-lwconnectors-shared-runner

stages:
  - pre-build
  - deploy

# ── MR Agent ────────────────────────────────────────────────
MR Agent:
  stage: pre-build
  needs: []
  trigger:
    project: "team-common-desktop-experience/mr-agent"
  variables:
    MERGE_REQUEST_URL: "${CI_MERGE_REQUEST_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Deploy relay server to dev ───────────────────────────────
deploy-relay/dev:
  stage: deploy
  image: docker-hub.pipeline.smartsheet.com/dockerhub/node:20-alpine
  script:
    - npm install -g pm2 --silent
    - cd bridge/slack/server
    - npm install --silent
    - pm2 restart smartbridge-relay || pm2 start src/index.js --name smartbridge-relay
    - pm2 save
  rules:
    - if: $DEV_ENV_RUNNER == ''
      when: never
    - if: $CI_MERGE_REQUEST_IID
      when: on_success
      allow_failure: false
    - if: $DEV_ENV_RUNNER
      when: manual
      allow_failure: true
  tags:
    - ${DEV_ENV_RUNNER}
